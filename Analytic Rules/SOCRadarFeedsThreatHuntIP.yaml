id: 7d1c4a52-3b0e-4c1d-9a55-0f6a2b9c1e01
name: SOCRadar Threat Feeds Threat Hunt IP
description: |
  'Matches active SOCRadar Threat Feeds IP indicators against the source or destination address of ASIM network sessions.'
severity: Medium
requiredDataConnectors:
  - connectorId: ThreatIntelligenceUploadIndicatorsAPI
    dataTypes:
      - ThreatIntelIndicators
queryFrequency: 15m
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
  - CommandAndControl
relevantTechniques:
  - T1041
  - T1568
customDetails:
  Collection: Collection
  Confidence: Confidence
  ValidUntil: ValidUntil
  IndicatorId: IndicatorId
  MatchedField: MatchedField
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1h
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'SOCRadar Threat Feed match: {{NetworkIP}} ({{Collection}})'
  alertDescriptionFormat: '**SOCRadar Threat Feeds indicator match**\n\nIndicator {{NetworkIP}} from collection {{Collection}} (confidence {{Confidence}}, valid until {{ValidUntil}}) was seen in the {{SourceTable}} table (matched on {{MatchedField}}).\n'
  alertDynamicProperties:
    - alertProperty: AlertLink
      value: https://platform.socradar.com
query: |
  let ioc_lookBack = 14d;
  let event_lookBack = 1h;
  let indicators = ThreatIntelIndicators
      | where SourceSystem == "SOCRadar Threat Feeds"
      | where ObservableKey == "ipv4-addr:value"
      | where isnotempty(ObservableValue)
      | where TimeGenerated >= ago(ioc_lookBack)
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id
      | where IsActive == true and ValidUntil > now()
      | extend Collection = coalesce(extract(@"^SOCRadar feed: (.+)$", 1, tostring(Data.description)), "SOCRadar feed")
      | extend IndicatorIp = ObservableValue
      | project IndicatorIp, Collection, Confidence, ValidUntil, IndicatorId = Id;
  let dst = _Im_NetworkSession(starttime = ago(event_lookBack))
      | where isnotempty(DstIpAddr)
      | join kind=inner indicators on $left.DstIpAddr == $right.IndicatorIp
      | extend MatchedField = "DstIpAddr";
  let src = _Im_NetworkSession(starttime = ago(event_lookBack))
      | where isnotempty(SrcIpAddr)
      | join kind=inner indicators on $left.SrcIpAddr == $right.IndicatorIp
      | extend MatchedField = "SrcIpAddr";
  union dst, src
  | project NetworkIP = IndicatorIp, MatchedField, Collection, Confidence, ValidUntil, IndicatorId, SourceTable = column_ifexists("Type", ""), DvcHostname, TimeGenerated
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: NetworkIP
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DvcHostname
version: 1.0.0
kind: Scheduled
