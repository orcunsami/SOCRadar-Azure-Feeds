id: 7d1c4a52-3b0e-4c1d-9a55-0f6a2b9c1e04
name: SOCRadar Threat Feeds Threat Hunt File Hash
description: |
  'Matches active SOCRadar Threat Feeds file hash indicators (SHA-256, SHA-1, MD5) against ASIM file events.'
severity: Medium
requiredDataConnectors:
  - connectorId: ThreatIntelligenceUploadIndicatorsAPI
    dataTypes:
      - ThreatIntelIndicators
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - Execution
  - Persistence
relevantTechniques:
  - T1189
  - T1059
  - T1554
customDetails:
  Collection: Collection
  Confidence: Confidence
  ValidUntil: ValidUntil
  IndicatorId: IndicatorId
  MatchedField: MatchedField
  EventKey: EventKey
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 2h
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'SOCRadar Threat Feed match: {{Hash}} ({{Collection}})'
  alertDescriptionFormat: '**SOCRadar Threat Feeds indicator match**\n\nIndicator {{Hash}} from collection {{Collection}} was seen in your logs (matched on {{MatchedField}}).\n'
  alertDynamicProperties:
    - alertProperty: AlertLink
      value: SocradarLink
query: |
  let ioc_lookBack = 14d;
  let event_lookBack = 2h;
  let alerted = SecurityAlert
      | where TimeGenerated > ago(4h)
      | where tostring(parse_json(ExtendedProperties)["Analytic Rule Name"]) == "SOCRadar Threat Feeds Threat Hunt File Hash"
      | extend EventKey = tostring(parse_json(tostring(parse_json(ExtendedProperties)["Custom Details"])).EventKey[0])
      | distinct EventKey;
  let indicators = ThreatIntelIndicators
      | where SourceSystem == "SOCRadar Threat Feeds"
      | where ObservableKey startswith "file:hashes"
      | where isnotempty(ObservableValue)
      | where TimeGenerated >= ago(ioc_lookBack)
      | summarize LatestIndicatorTime = arg_max(TimeGenerated, *) by Id
      | where IsActive == true and ValidUntil > now()
      | extend Collection = coalesce(extract(@"^SOCRadar feed: (.+)$", 1, tostring(Data.description)), "SOCRadar feed")
      | extend IndicatorHash = tolower(ObservableValue)
      | project IndicatorHash, Collection, Confidence, ValidUntil, IndicatorId = Id;
  _Im_FileEvent(starttime = ago(event_lookBack))
  | extend HashCandidates = pack_array(
      bag_pack("Algorithm", "SHA256", "Hash", tolower(TargetFileSHA256)),
      bag_pack("Algorithm", "SHA1", "Hash", tolower(TargetFileSHA1)),
      bag_pack("Algorithm", "MD5", "Hash", tolower(TargetFileMD5)))
  | mv-expand HashCandidates
  | extend HashType = tostring(HashCandidates.Algorithm), EventHash = tostring(HashCandidates.Hash)
  | where isnotempty(EventHash)
  | join kind=inner indicators on $left.EventHash == $right.IndicatorHash
  | extend EventKey = strcat(IndicatorId, "|", DvcHostname, "|", tostring(TimeGenerated))
  | where EventKey !in (alerted)
  | project EventKey, Hash = EventHash, HashType, MatchedField = strcat("TargetFile", HashType), Collection, Confidence, ValidUntil, IndicatorId, SourceTable = column_ifexists("Type", ""), DvcHostname, SocradarLink = "https://platform.socradar.com", TimeGenerated
entityMappings:
  - entityType: FileHash
    fieldMappings:
      - identifier: Value
        columnName: Hash
      - identifier: Algorithm
        columnName: HashType
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DvcHostname
version: 1.0.0
kind: Scheduled
